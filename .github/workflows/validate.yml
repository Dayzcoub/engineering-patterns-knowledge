name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate JSON and references
        run: python scripts/validate.py
      - name: Test search and catalog
        run: python -m unittest discover -s tests -v
      - name: Smoke query
        run: python scripts/search_patterns.py --project KLIDAN "reconnect late response"
